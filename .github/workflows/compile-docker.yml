name: Build ARM64 source image

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
      - name: Build the deployment image without publishing
        run: docker build --platform linux/arm64 --progress=plain .
